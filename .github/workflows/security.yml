name: DevSecOps Security Scan

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t secure-employee-portal:${{ github.sha }} .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0@master
        with:
          image-ref: secure-employee-portal:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
